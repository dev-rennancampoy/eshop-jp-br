name: Crawl e deploy

on:
  schedule:
    - cron: '17 */6 * * *' # a cada 6 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # O SQLite guarda o histórico de preços entre execuções.
      - name: Restaura banco
        uses: actions/cache/restore@v4
        with:
          path: data/eshop.db
          key: eshop-db-${{ github.run_id }}
          restore-keys: eshop-db-

      - run: npm run crawl
      - run: npm run build

      - name: Salva banco
        uses: actions/cache/save@v4
        with:
          path: data/eshop.db
          key: eshop-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
